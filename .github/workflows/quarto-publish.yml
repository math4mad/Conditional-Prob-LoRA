name: Publish Quarto Report

on:
  push:
    branches: [main]
    paths:
      - 'report.qmd'
      - '.github/workflows/quarto-publish.yml'
      - 'output/eval_report_*.json'
      - 'output/train516.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install -q pandas matplotlib tabulate jupyter pyyaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render Quarto
        run: |
          quarto render report.qmd --to html --output-dir _site --output index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
